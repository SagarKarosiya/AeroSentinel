name: AeroSentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-checks:
    name: Python Validation and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn==1.8.0 joblib fastapi==0.162.0 httpx pytest

      - name: Check Python syntax
        run: |
          python -m compileall -q src dashboard

      - name: Run automated tests
        run: |
          python -m pytest -v src

      - name: Verify essential project files
        run: |
          python -c "from pathlib import Path; files = ['README.md', 'requirements.txt', 'src', 'dashboard', 'models/holybro_isolation_forest.joblib', 'models/speedybee_isolation_forest.joblib', 'models/holybro_future_remaining_time_30s.joblib']; missing = [f for f in files if not Path(f).exists()]; print('Missing:', missing); assert not missing"
