name: AeroSentinel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-checks:
    name: Python Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall -q src dashboard

      - name: Run automated tests
        run: |
          if [ -d "test" ] || [ -d "tests" ]; then
            python -m pytest -q
          else
            echo "No test directory found. Skipping tests."
          fi

      - name: Verify essential project files
        run: |
          python -c "from pathlib import Path; files = ['README.md', 'requirements.txt', 'src', 'dashboard']; missing = [f for f in files if not Path(f).exists()]; print('Missing:', missing); assert not missing"
